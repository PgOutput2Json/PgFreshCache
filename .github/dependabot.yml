# Updates of the dependencies, once a month, each ecosystem in one grouped pull request. Security updates come
# separately, as soon as there's an advisory (Dependabot alerts in the repository's settings).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # major versions by hand: a new major can change its API or drop a target framework, a new .NET version is a
      # change of the target frameworks, and EF Core 9 on net8.0/net9.0 must stay on 9 (EF Core 10 needs net10.0)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # the library references the lowest version for each target framework (8.0.0, 9.0.0, 10.0.0) on purpose, so an
      # application is not made to upgrade it
      - dependency-name: 'Microsoft.Extensions.Hosting.Abstractions'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
